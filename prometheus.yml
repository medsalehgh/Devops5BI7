global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'springboot-app'
    static_configs:
      - targets: ['192.168.33.10:8089']  # Replace with Spring Boot app container name or IP

  - job_name: 'jenkins'
    static_configs:
      - targets: ['192.168.33.10:8080']  # Replace with Jenkins container name or IP
